<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FERAMED LOGISTICS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">

    <!-- Экран входа -->
    <div id="login-screen" class="flex flex-col items-center justify-center h-screen">
        <h1 class="text-2xl font-bold mb-8 text-teal-800">FERAMED LOGISTICS</h1>
        <div class="bg-white p-8 rounded-xl shadow-md w-80">
            <h2 class="mb-4 text-center">Выберите роль</h2>
            <button onclick="login('Руководитель')" class="w-full bg-teal-600 text-white p-2 rounded mb-2">Руководитель</button>
            <button onclick="login('Курьер')" class="w-full bg-gray-600 text-white p-2 rounded">Курьер</button>
        </div>
    </div>

    <!-- Дашборд (скрыт по умолчанию) -->
    <div id="dashboard" class="hidden p-8">
        <h1 class="text-2xl font-bold mb-6 text-teal-800">FERAMED LOGISTICS</h1>
        <div class="grid grid-cols-3 gap-6">
            <!-- Карточки будут здесь -->
            <div class="bg-white p-6 rounded-xl border border-gray-200">ВЫРУЧКА: <h2 id="total-revenue" class="text-2xl font-bold">0 UZS</h2></div>
        </div>
        <button onclick="location.reload()" class="mt-8 text-red-500">Выйти</button>
    </div>

    <script>
        function login(role) {
            // Здесь будет логика проверки пароля или ключа
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            console.log("Вход как:", role);
        }
    </script>
</body>
</html>
