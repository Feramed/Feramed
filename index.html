<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ферамед · Диспетчер</title>
<!-- Здесь ваш CSS из исходного файла feramed (2).html -->
<style>
  :root{--navy:#10243E; --teal:#17A398; --bg:#F6F5F1; --card:#FFFFFF; --text:#142433; --muted:#6B7A8D; --line:#E4E1D8; --radius:10px;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:sans-serif;}
  .container{max-width:1100px;margin:0 auto;padding:20px;}
  .role-picker{max-width:420px;margin:60px auto;text-align:center;}
  .options{display:flex;flex-direction:column;gap:10px;}
  button{cursor:pointer;padding:15px;border-radius:10px;border:1px solid #ccc;background:#fff;}
  .hidden{display:none;}
</style>
</head>
<body>

<!-- Экран выбора роли -->
<div class="container" id="pickerView">
  <div class="role-picker">
    <h1>Кто вы?</h1>
    <div class="options">
      <button data-role="manager">Менеджер</button>
      <button data-role="driver">Водитель</button>
      <button data-role="leader">Руководство</button>
      <button data-role="accountant">Бухгалтер</button>
    </div>
  </div>
</div>

<!-- Экран входа -->
<div class="container hidden" id="authView">
  <div class="role-picker">
    <h2 id="authTitle">Вход</h2>
    <input type="email" id="loginEmail" placeholder="Email" style="width:100%;padding:10px;margin-bottom:10px;">
    <input type="password" id="loginPassword" placeholder="Пароль" style="width:100%;padding:10px;">
    <button id="loginBtn" style="width:100%;background:var(--teal);color:#fff;margin-top:10px;">Войти</button>
    <button onclick="location.reload()" style="width:100%;margin-top:10px;">Назад</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAnOTHALZItIekuI5kjG5nRV0ooh-jQo_Q",
    authDomain: "feramed-67f4b.firebaseapp.com",
    projectId: "feramed-67f4b",
    storageBucket: "feramed-67f4b.firebasestorage.app",
    messagingSenderId: "1066328830928",
    appId: "1:1066328830928:web:86fa4a21d03d6ec9c4ffd5"
  };

  initializeApp(firebaseConfig);
  const auth = getAuth();
  let currentRole = null;

  // Логика кнопок
  document.querySelectorAll('[data-role]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentRole = btn.getAttribute('data-role');
      document.getElementById('pickerView').classList.add('hidden');
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('authTitle').textContent = 'Вход: ' + currentRole;
    });
  });

 // Логика входа
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPassword').value;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      
      // СКРЫВАЕМ ВХОД И ПОКАЗЫВАЕМ ДАШБОРД
      document.getElementById('authView').classList.add('hidden');
      
      // Если у вас в коде есть элементы с id="managerView", "driverView" и т.д., 
      // они должны отобразиться здесь. Например:
      const dashboard = document.getElementById(currentRole + 'View');
      if (dashboard) {
          dashboard.classList.remove('hidden');
      } else {
          alert('Вход выполнен, но интерфейс для роли ' + currentRole + ' пока не найден в коде!');
      }
      
    } catch (e) {
      alert('Ошибка входа: ' + e.message);
    }
  });
