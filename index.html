<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FERAMED LOGISTICS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-8">
    <div id="app" class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-teal-600">FERAMED LOGISTICS</h1>
        <div id="content">Загрузка системы...</div>
    </div>

    <script>
        // Используем dbClient вместо supabase, чтобы избежать конфликтов имен
        const dbClient = supabase.createClient(
            'https://inyiwbyffaqziyyusipx.supabase.co', 
            'sb_publishable_GtH9_fEmD9qoLJ4w-ruvwQ_9OvqN84V'
        );
        
        async function init() {
            try {
                const { data, error } = await dbClient.from('orders').select('*');
                
                if (error) throw error;
                
                if (!data || data.length === 0) {
                    document.getElementById('content').innerHTML = "В базе пока нет заказов.";
                    return;
                }
                
                document.getElementById('content').innerHTML = `
                    <p class="mb-4 font-semibold">Система активна. Заказов в базе: ${data.length}</p>
                    <ul class="space-y-2">
                        ${data.map(o => `
                            <li class="p-3 border rounded shadow-sm hover:bg-teal-50 transition">
                                <span class="font-bold">ID: ${o.id || '---'}</span> | 
                                <span class="text-gray-600">Статус: ${o.status || 'нет данных'}</span>
                            </li>
                        `).join('')}
                    </ul>
                `;
            } catch (e) {
                document.getElementById('content').innerHTML = 
                    "<p class='text-red-500'>Ошибка подключения к базе: " + e.message + "</p>";
                console.error("Ошибка Supabase:", e);
            }
        }
        
        // Запускаем загрузку
        init();
    </script>
</body>
</html>
