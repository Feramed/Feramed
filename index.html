<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ферамед · Диспетчер</title>
<!-- Стили оставьте прежние, они у вас отличные -->
</head>
<body>
<!-- (Здесь ваш HTML-код интерфейса из ферamed (2).html, просто добавьте кнопку в role-picker) -->
<div class="options">
  <button data-role="manager">Менеджер<span class="sub">Оформляет заказы клиникам</span></button>
  <button data-role="driver">Водитель<span class="sub">Забирает и доставляет заказы</span></button>
  <button data-role="leader">Руководство<span class="sub">Общая статистика</span></button>
  <button data-role="accountant">Бухгалтер<span class="sub">Финансовая аналитика</span></button>
</div>

<!-- (Остальной HTML-код вашего ферamed (2).html остается без изменений) -->

<script type="module">
// ... импорты Firebase и настройки firebaseConfig остаются прежними ...

// ОБНОВЛЕННАЯ ЛОГИКА РОЛЕЙ
const ROLE_NAMES = {
    manager: 'Менеджер',
    driver: 'Водитель',
    leader: 'Руководство',
    accountant: 'Бухгалтер'
};

// Функция showApp с поддержкой бухгалтера
function showApp(){
  hideAll();
  document.getElementById('sessionChip').style.display='flex';
  document.getElementById('sessionRoleTag').textContent = ROLE_NAMES[currentRole];
  document.getElementById('sessionName').textContent = userProfile?.name || '';
  
  if(currentRole==='manager') document.getElementById('managerView').style.display='block';
  if(currentRole==='driver') document.getElementById('driverView').style.display='block';
  if(currentRole==='leader'||currentRole==='accountant') document.getElementById('leaderView').style.display='block';
  
  renderAll();
}

// Добавьте это в renderAll, чтобы менеджер видел свою аналитику
function renderAll(){
  if(currentRole==='manager') {
      renderDispatch();
      // Можно здесь же вызвать renderLeader(), если добавить блок аналитики в managerView
  }
  if(currentRole==='driver') renderDriverTab();
  if(currentRole==='leader' || currentRole==='accountant') renderLeader();
  if(document.getElementById('historyTab')?.style.display!=='none') renderHistory();
}
</script>
</body>
</html>
